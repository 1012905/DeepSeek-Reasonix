<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会话管理 · 预览</title>
<style>
  /* 仅用于离线预览的主题变量（近似 app.css 浅色主题） */
  :root {
    --page: #f4f5f7;
    --text: #1c1d1f;
    --muted: #6b7280;
    --border: #e3e5e8;
    --faint: #cfd3d8;
    --float: #ffffff;
    --float-hi: #ffffff;
    --accent: #4b6bfb;
    --accent-fg: #ffffff;
    --overlay: rgba(0,0,0,.06);
    --danger: #e5484d;
    --danger-fg: #ffffff;
    --r-sm: 8px;
    --r-md: 12px;
    --ui: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --fs-ui: 13px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--ui); color: var(--text); background: #dfe2e7; }

  /* ===== SessionManager 实际样式（来自 session-manager.css） ===== */
  .sm-backdrop {
    position: fixed; inset: 0; background: color-mix(in srgb, var(--page) 55%, transparent);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .sm-panel {
    width: min(880px, 94vw); height: min(78vh, 760px); display: flex; flex-direction: column;
    background: var(--float); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--r-md); box-shadow: 0 24px 60px rgb(0 0 0 / .28); overflow: hidden;
  }
  .sm-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sm-head h2 { margin: 0; font: 600 16px/1 var(--ui); }
  .sm-count { color: var(--muted); font: 400 12px var(--ui); }
  .sm-x { margin-left: auto; display: inline-flex; padding: 6px; border-radius: var(--r-sm);
    background: transparent; border: none; color: var(--muted); cursor: pointer; }
  .sm-x:hover { background: var(--overlay); color: var(--text); }
  .sm-filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sm-search { display: inline-flex; align-items: center; gap: 6px; flex: 1 1 220px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--muted); background: var(--page); }
  .sm-search input { border: none; outline: none; background: transparent; color: var(--text);
    font: 400 13px var(--ui); width: 100%; }
  .sm-seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
  .sm-seg button { border: none; background: transparent; color: var(--muted); padding: 6px 12px;
    font: 500 13px var(--ui); cursor: pointer; }
  .sm-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .sm-ws { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px 10px;
    background: var(--page); color: var(--text); font: 400 13px var(--ui); max-width: 220px; }
  .sm-toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .sm-selall { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font: 500 13px var(--ui); cursor: pointer; }
  .sm-status { color: var(--muted); font: 400 12px var(--ui); }
  .sm-spacer { flex: 1; }
  .sm-danger { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--danger);
    background: var(--danger); color: #fff; padding: 6px 14px; border-radius: var(--r-sm);
    font: 600 13px var(--ui); cursor: pointer; }
  .sm-danger:disabled { opacity: .45; cursor: not-allowed; }
  .sm-list { flex: 1; overflow: auto; padding: 6px 8px; }
  .sm-empty { color: var(--muted); text-align: center; padding: 32px 0; font: 400 13px var(--ui); }
  .sm-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); }
  .sm-row.is-sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .sm-row.is-running { opacity: .72; }
  .sm-check { width: 16px; height: 16px; }
  .sm-open { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left;
    background: transparent; border: none; cursor: pointer; color: var(--text); padding: 2px 0; }
  .sm-open:hover .sm-title { color: var(--accent); }
  .sm-title { font: 500 14px/1.2 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sm-meta { display: flex; gap: 10px; color: var(--muted); font: 400 12px var(--ui); }
  .sm-badges { display: inline-flex; gap: 6px; flex: none; }
  .sm-badge { font: 400 11px var(--ui); padding: 2px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
  .sm-badge.running { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .sm-badge.unread { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .sm-note { margin: 0; padding: 8px 16px; color: var(--muted); font: 400 12px var(--ui); border-top: 1px solid var(--border); }

  .studio-icon { width: 16px; height: 16px; display: inline-block; vertical-align: middle; }

  /* ===== 二次确认弹窗（来自 session-batch.css 的 .wsconfirm 近似样式） ===== */
  .wsconfirm {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--page) 40%, transparent);
  }
  .wsconfirm-t, .wsconfirm-a { background: var(--float); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 18px 20px; width: min(420px, 92vw); box-shadow: 0 16px 40px rgb(0 0 0 / .25); }
  .wsconfirm-t .q { display: block; font: 600 15px/1.4 var(--ui); }
  .wsconfirm-t .session-batch-names { display: block; margin-top: 6px; color: var(--muted); font: 400 13px var(--ui); }
  .wsconfirm-t .h { display: block; margin-top: 4px; color: var(--muted); font: 400 12px var(--ui); }
  .wsconfirm-a { display: flex; gap: 10px; justify-content: flex-end; padding-top: 0; border-top: none; }
  .wsconfirm-a button { border: 1px solid var(--border); background: var(--float); color: var(--text);
    padding: 7px 16px; border-radius: var(--r-sm); font: 600 13px var(--ui); cursor: pointer; }
  .wsconfirm-a button[data-danger] { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* Toast 反馈 */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b2d31; color: #fff;
    padding: 10px 16px; border-radius: 10px; font: 500 13px var(--ui); box-shadow: 0 8px 24px rgb(0 0 0 / .3); }

  /* 侧边栏入口示意 */
  .rail-demo { position: fixed; left: 16px; top: 16px; width: 240px; background: var(--float); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); }
  .rail-demo .more { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; }
  .rail-demo .more:hover { background: var(--overlay); }
  .rail-demo .pop { margin-top: 4px; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
  .rail-demo .pop button { display: flex; align-items: center; gap: 8px; width: 100%; border: none; background: var(--float);
    padding: 8px 10px; cursor: pointer; font: 500 13px var(--ui); color: var(--text); }
  .rail-demo .pop button:hover { background: var(--overlay); }
</style>
</head>
<body>

<!-- 侧边栏「更多操作」入口示意 -->
<div class="rail-demo">
  <div class="more"><svg class="studio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg> 更多操作</div>
  <div class="pop">
    <button><svg class="studio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m5 12 4 4L19 6"/></svg> 选择本机会话</button>
    <button style="color:var(--accent)"><svg class="studio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 3 10 5-10 5L2 8l10-5zM2 12l10 5 10-5M2 16l10 5 10-5"/></svg> 管理会话</button>
  </div>
</div>

<!-- 会话管理界面 -->
<div class="sm-backdrop">
  <div class="sm-panel" role="dialog" aria-modal="true" aria-label="会话管理">
    <header class="sm-head">
      <h2>会话管理</h2>
      <span class="sm-count">共 6 个会话</span>
      <button class="sm-x" aria-label="关闭"><svg class="studio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>

    <div class="sm-filters">
      <label class="sm-search">
        <svg class="studio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 15l6 6M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0"/></svg>
        <input type="search" placeholder="按名称搜索…" />
      </label>
      <div class="sm-seg" role="group" aria-label="范围">
        <button aria-pressed="true">全部</button>
        <button aria-pressed="false">进行中</button>
        <button aria-pressed="false">置顶</button>
        <button aria-pressed="false">归档</button>
      </div>
      <select class="sm-ws" aria-label="项目">
        <option>所有项目</option>
        <option>my-project</option>
        <option>client-portal</option>
      </select>
    </div>

    <div class="sm-toolbar">
      <label class="sm-selall">
        <input type="checkbox" id="selall" />
        <span>全选</span>
      </label>
      <span class="sm-status" id="status">已选 2 个</span>
      <span class="sm-spacer"></span>
      <button class="sm-danger" id="deleteBtn">
        <svg class="studio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>
        <span>删除所选</span>
      </button>
    </div>

    <div class="sm-list" role="list">
      <!-- 选中 -->
      <div class="sm-row is-sel">
        <input type="checkbox" class="sm-check" checked />
        <button class="sm-open">
          <span class="sm-title">重构鉴权中间件以支持多租户</span>
          <span class="sm-meta"><span class="sm-ws">my-project</span><span>12 轮</span><span>2026/10/25</span></span>
        </button>
        <span class="sm-badges"><span class="sm-badge">置顶</span></span>
      </div>
      <!-- 选中 -->
      <div class="sm-row is-sel">
        <input type="checkbox" class="sm-check" checked />
        <button class="sm-open">
          <span class="sm-title">客户门户首页改版方案</span>
          <span class="sm-meta"><span class="sm-ws">client-portal</span><span>5 轮</span><span>2026/10/24</span></span>
        </button>
        <span class="sm-badges"><span class="sm-badge unread">未读</span></span>
      </div>
      <!-- 未选中 -->
      <div class="sm-row">
        <input type="checkbox" class="sm-check" />
        <button class="sm-open">
          <span class="sm-title">数据导出脚本调试</span>
          <span class="sm-meta"><span class="sm-ws">my-project</span><span>23 轮</span><span>2026/10/20</span></span>
        </button>
        <span class="sm-badges"><span class="sm-badge">归档</span></span>
      </div>
      <!-- 运行中：禁用勾选 -->
      <div class="sm-row is-running">
        <input type="checkbox" class="sm-check" disabled />
        <button class="sm-open">
          <span class="sm-title">实时日志分析 agent</span>
          <span class="sm-meta"><span class="sm-ws">my-project</span><span>进行中</span></span>
        </button>
        <span class="sm-badges"><span class="sm-badge running">进行中</span></span>
      </div>
      <div class="sm-row">
        <input type="checkbox" class="sm-check" />
        <button class="sm-open">
          <span class="sm-title">周报自动生成 prompt 调优</span>
          <span class="sm-meta"><span class="sm-ws">client-portal</span><span>3 轮</span><span>2026/10/18</span></span>
        </button>
      </div>
      <div class="sm-row">
        <input type="checkbox" class="sm-check" />
        <button class="sm-open">
          <span class="sm-title">新会话</span>
          <span class="sm-meta"><span class="sm-ws">my-project</span><span>0 轮</span></span>
        </button>
      </div>
    </div>

    <p class="sm-note">进行中的会话需先停止，不会被删除</p>
  </div>
</div>

<!-- 二次确认弹窗 -->
<div class="wsconfirm" id="confirm">
  <div>
    <div class="wsconfirm-t">
      <span class="q">删除 2 个会话？</span>
      <span class="session-batch-names">重构鉴权中间件以支持多租户、客户门户首页改版方案</span>
      <span class="h">连同其记录一并删除，且无法恢复</span>
    </div>
    <div class="wsconfirm-a">
      <button id="cancelBtn">取消</button>
      <button data-danger id="confirmBtn">删除</button>
    </div>
  </div>
</div>

<script>
  // 轻量交互：全选 / 打开确认 / 确认后显示成功 Toast
  const selall = document.getElementById('selall');
  const checks = [...document.querySelectorAll('.sm-check:not([disabled])')];
  const status = document.getElementById('status');
  const update = () => {
    const checked = checks.filter(c => c.checked).length;
    status.textContent = '已选 ' + checked + ' 个';
    selall.checked = checked === checks.length && checked > 0;
    selall.indeterminate = checked > 0 && checked < checks.length;
  };
  selall.addEventListener('change', () => { checks.forEach(c => c.checked = selall.checked); update(); });
  checks.forEach(c => c.addEventListener('change', update));
  update();

  const confirm = document.getElementById('confirm');
  document.getElementById('deleteBtn').addEventListener('click', () => confirm.style.display = 'flex');
  document.getElementById('cancelBtn').addEventListener('click', () => confirm.style.display = 'none');
  document.getElementById('confirmBtn').addEventListener('click', () => {
    confirm.style.display = 'none';
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = '已删除 2 个会话';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  });
</script>
</body>
</html>
